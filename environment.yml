name: cumin_genome
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.8
  - snakemake
  - fastqc=0.11.9
  - trimmomatic=0.39
  - jellyfish=2.3.0
  - genomescope2=2.0
  - masurca=4.0.6
  - getorganelle
  - edta=2.1.0
  - evidencemodeler=2.1.0
  - diamond
  - eggnog-mapper=2.1.15
  - hmmer=3.3.2
  - primer3=2.6.1
  - bwa=0.7.17
  - freebayes=1.3.6
  - hisat2
  - pip
  - pip:
      - biopython
      - pandas
      - matplotlib
      - seaborn
